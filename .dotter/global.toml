[settings]
default_target_type = "symbolic"

[glazewm.files]
".glzr/glazewm/config.yaml" = "~/.glzr/glazewm/config.yaml"
".glzr/glazewm/focus_lock.py" = "~/.glzr/glazewm/focus_lock.py"
".glzr/glazewm/keybinds.ps1" = "~/.glzr/glazewm/keybinds.ps1"

# Zebar is left out: it won't load widget files through symlinks. copy_to_user_folder.bat deploys it.

[flowlauncher.files]
"FlowLauncher/Settings/Settings.json" = "~/AppData/Roaming/FlowLauncher/Settings/Settings.json"
"FlowLauncher/Themes/ryha.xaml" = "~/AppData/Roaming/FlowLauncher/Themes/ryha.xaml"
"FlowLauncher/Scripts/toggle_lid_sleep.ps1" = "~/AppData/Roaming/FlowLauncher/Scripts/toggle_lid_sleep.ps1"

# Keyboard Manager/default.json is left out: toggle_keyboard_layout.ps1 overwrites it to switch layouts.
[powertoys.files]
"PowerToys/settings.json" = "~/AppData/Local/Microsoft/PowerToys/settings.json"
"PowerToys/Keyboard Manager/editorSettings.json" = "~/AppData/Local/Microsoft/PowerToys/Keyboard Manager/editorSettings.json"
"PowerToys/Keyboard Manager/settings.json" = "~/AppData/Local/Microsoft/PowerToys/Keyboard Manager/settings.json"
"PowerToys/Keyboard Manager/layout_default.json" = "~/AppData/Local/Microsoft/PowerToys/Keyboard Manager/layout_default.json"
"PowerToys/Keyboard Manager/layout_remapped.json" = "~/AppData/Local/Microsoft/PowerToys/Keyboard Manager/layout_remapped.json"
"PowerToys/Keyboard Manager/toggle_keyboard_layout.ps1" = "~/AppData/Local/Microsoft/PowerToys/Keyboard Manager/toggle_keyboard_layout.ps1"
"PowerToys/Keyboard Manager/toggle_keyboard_layout.bat" = "~/AppData/Local/Microsoft/PowerToys/Keyboard Manager/toggle_keyboard_layout.bat"

# AltSnap.ini is left out: AltSnap doesn't read it through a symlink, and it runs elevated from Program Files.
# setup-elevated-windows.ps1 deploys it. The empty package keeps existing local.toml files valid.
[altsnap.files]

[powershell.files]
"PowerShell/profile_loader.ps1" = { target = "~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1", type = "template" }
"PowerShell/starship.toml" = "~/.config/starship.toml"

# Vicinae: hypr-win.jsonc is imported by its settings.json (setup-windows.ps1), and the Script Commands go in its
# default script folder. The power-* ones are also the SUPER+Escape menu (hyprwin powermenu).
[vicinae.files]
"Vicinae/hypr-win.jsonc" = "~/AppData/Local/vicinae/config/hypr-win.jsonc"
"Vicinae/scripts/create-app-shortcut.ps1" = "~/AppData/Local/vicinae/data/scripts/create-app-shortcut.ps1"
"Vicinae/scripts/power-hibernate.ps1" = "~/AppData/Local/vicinae/data/scripts/power-hibernate.ps1"
"Vicinae/scripts/power-lid-sleep.ps1" = "~/AppData/Local/vicinae/data/scripts/power-lid-sleep.ps1"
"Vicinae/scripts/power-lock.ps1" = "~/AppData/Local/vicinae/data/scripts/power-lock.ps1"
"Vicinae/scripts/power-logout.ps1" = "~/AppData/Local/vicinae/data/scripts/power-logout.ps1"
"Vicinae/scripts/power-relaunch-wm.ps1" = "~/AppData/Local/vicinae/data/scripts/power-relaunch-wm.ps1"
"Vicinae/scripts/power-reopen-apps.ps1" = "~/AppData/Local/vicinae/data/scripts/power-reopen-apps.ps1"
"Vicinae/scripts/power-restart.ps1" = "~/AppData/Local/vicinae/data/scripts/power-restart.ps1"
"Vicinae/scripts/power-shutdown.ps1" = "~/AppData/Local/vicinae/data/scripts/power-shutdown.ps1"
"Vicinae/scripts/power-sleep.ps1" = "~/AppData/Local/vicinae/data/scripts/power-sleep.ps1"
